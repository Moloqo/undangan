<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Check-in Tamu — INVITO</title>
<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-appcheck-compat.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,'Segoe UI',Roboto,sans-serif;background:#0f0d0a;color:#f5efe2;min-height:100vh}
.header{background:#1a1712;padding:16px 20px;text-align:center;border-bottom:1px solid rgba(185,138,47,.3)}
.header h1{font-family:Georgia,serif;font-size:20px;color:#e8c86a}
.header p{font-size:12px;color:#888;margin-top:4px}
.scanner-wrap{position:relative;max-width:500px;margin:20px auto;padding:0 20px}
#video{width:100%;border-radius:16px;background:#000;display:block}
.scan-overlay{position:absolute;inset:20px;pointer-events:none;border:2px solid rgba(232,200,106,.6);border-radius:16px}
.scan-line{position:absolute;left:10%;right:10%;height:2px;background:#e8c86a;animation:scan 2s ease-in-out infinite}
@keyframes scan{0%,100%{top:20%}50%{top:80%}}
.result{max-width:500px;margin:20px auto;padding:0 20px}
.result-card{background:#1a1712;border:1px solid rgba(185,138,47,.4);border-radius:14px;padding:24px;text-align:center;display:none}
.result-card.show{display:block;animation:pop .3s}
@keyframes pop{from{transform:scale(.95);opacity:0}}
.result-card .icon{font-size:48px;margin-bottom:12px}
.result-card h2{font-family:Georgia,serif;font-size:22px;margin-bottom:8px}
.result-card p{color:#aaa;font-size:14px}
.result-card.success{border-color:#4caf50}
.result-card.success .icon{color:#4caf50}
.result-card.error{border-color:#f44336}
.stats{max-width:500px;margin:20px auto;padding:0 20px;display:grid;grid-template-columns:1fr 1fr;gap:12px}
.stat{background:#1a1712;border-radius:12px;padding:16px;text-align:center;border:1px solid rgba(185,138,47,.2)}
.stat b{font-size:28px;display:block;color:#e8c86a}
.stat span{font-size:12px;color:#888}
.manual{max-width:500px;margin:20px auto;padding:0 20px}
.manual input{width:100%;padding:14px;background:#1a1712;border:1px solid rgba(185,138,47,.3);border-radius:10px;color:#fff;font-size:16px;margin-bottom:10px}
.manual button{width:100%;padding:14px;background:#b98a2f;color:#fff;border:0;border-radius:10px;font-size:16px;font-weight:700;cursor:pointer}
#tokenInput{max-width:500px;margin:40px auto;padding:0 20px;text-align:center}
#tokenInput input{width:100%;padding:16px;font-size:18px;text-align:center;text-transform:uppercase;background:#1a1712;border:1px solid rgba(185,138,47,.4);border-radius:12px;color:#fff;margin-bottom:12px;letter-spacing:.1em}
#tokenInput button{width:100%;padding:16px;background:#b98a2f;color:#fff;border:0;border-radius:12px;font-size:16px;font-weight:700;cursor:pointer}
.hidden{display:none!important}
.popup-overlay{position:fixed;inset:0;background:rgba(0,0,0,.75);display:flex;align-items:center;justify-content:center;z-index:999;padding:20px}
.popup-card{background:#1a1712;border:2px solid #4caf50;border-radius:20px;padding:36px 28px;text-align:center;max-width:340px;width:100%;animation:pop .3s}
.popup-card.warn{border-color:#f5a623}
.popup-icon{font-size:64px;margin-bottom:12px}
.popup-card h2{font-family:Georgia,serif;font-size:26px;color:#4caf50;margin-bottom:8px;letter-spacing:.05em}
.popup-card.warn h2{color:#f5a623}
.popup-card p{color:#ccc;font-size:15px;margin:4px 0}
.popup-card #popupName{font-size:20px;font-weight:700;color:#fff}
.popup-card button{margin-top:20px;width:100%;padding:14px;background:#b98a2f;color:#fff;border:0;border-radius:12px;font-size:16px;font-weight:700;cursor:pointer}
.history{max-width:500px;margin:0 auto 20px;padding:0 20px}
.history-title{font-size:13px;color:#888;margin-bottom:8px;text-align:center}
#checkinList{list-style:none}
#checkinList li{background:#1a1712;border:1px solid rgba(185,138,47,.25);border-radius:10px;padding:12px 16px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center;gap:10px}
#checkinList li .nm{font-weight:700;color:#f5efe2;font-size:15px}
#checkinList li .tm{font-size:12px;color:#888;white-space:nowrap}
#checkinList li.empty{justify-content:center;color:#888;font-size:14px}
#checkinList li.new{animation:pop .3s;border-color:#4caf50}
#pendingList{list-style:none}
#pendingList li{background:#1a1712;border:1px solid rgba(245,166,35,.3);border-radius:10px;padding:12px 16px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center;gap:10px}
#pendingList li .nm{font-weight:700;color:#f5efe2;font-size:15px}
#pendingList li .tm{font-size:12px;color:#f5a623;white-space:nowrap}
#pendingList li.empty{justify-content:center;color:#888;font-size:14px;border-style:dashed}
.upload-qr{max-width:500px;margin:0 auto;padding:0 20px;text-align:center}
.upload-btn{display:inline-block;padding:13px 24px;background:#1a1712;border:1.5px solid #b98a2f;color:#e8c86a;border-radius:10px;font-size:15px;font-weight:700;cursor:pointer;margin-bottom:10px}
.retry-btn{display:block;width:100%;padding:12px;background:transparent;border:1px solid rgba(185,138,47,.3);color:#aaa;border-radius:10px;font-size:14px;cursor:pointer;margin-top:4px}
</style>
</head>
<body>
<div class="header">
  <h1>✦ INVITO Check-in ✦</h1>
  <p>Scan QR tamu untuk mencatat kehadiran</p>
</div>

<div id="tokenInput">
  <p style="margin-bottom:16px;color:#aaa">Masukkan kode token undangan</p>
  <input id="tokenCode" placeholder="KODE TOKEN" maxlength="12">
  <button onclick="startCheckin()">Mulai Check-in</button>
</div>

<div id="checkinUI" class="hidden">
  <div class="scanner-wrap">
    <video id="video" playsinline></video>
    <div class="scan-overlay"><div class="scan-line"></div></div>
  </div>
  <div class="upload-qr">
    <p style="font-size:13px;color:#888;margin-bottom:8px;text-align:center">kamera gak bisa? upload foto QR-nya</p>
    <label for="qrFile" class="upload-btn">📷 Upload Foto QR</label>
    <input type="file" id="qrFile" accept="image/*" style="display:none">
    <button type="button" id="retryCam" class="retry-btn" onclick="startCamera()">🔄 Coba Kamera Lagi</button>
  </div>
  <div class="result"><div class="result-card" id="resultCard"></div></div>
  <div class="stats">
    <div class="stat"><b id="statTotal">…</b><span>Total Tamu</span></div>
    <div class="stat"><b id="statChecked">…</b><span>Sudah Check-in</span></div>
  </div>
  <div class="history">
    <p class="history-title">Riwayat Check-in</p>
    <ul id="checkinList"><li class="empty">Memuat...</li></ul>
  </div>
  <div class="history">
    <p class="history-title">⏳ Belum Check-in (<span id="pendingCount">…</span>)</p>
    <ul id="pendingList"><li class="empty">Memuat...</li></ul>
  </div>
  <div class="manual">
    <p style="font-size:13px;color:#888;margin-bottom:8px;text-align:center">atau masukkan nama manual</p>
    <input id="manualName" placeholder="Nama tamu">
    <button onclick="manualCheckin()">Catat Kehadiran</button>
  </div>
</div>

<canvas id="canvas" style="display:none"></canvas>

<script>
// Firebase config (same as catalog)
var firebaseConfig = {
  apiKey: "<redacted>",
  authDomain: "undangan-digital-f4310.firebaseapp.com",
  projectId: "undangan-digital-f4310",
  messagingSenderId: "220097197481",
  appId: "1:220097197481:web:03ccc55291a89f4063c0b8"
};
try{ firebase.initializeApp(firebaseConfig); }catch(e){}
var db = firebase.firestore();
/* App Check (reCAPTCHA v3) — bukti request datang dari web INVITO.
   Tanpa enforcement, request tanpa token tetap jalan (mode monitor). */
try{ if(firebase.appCheck){ firebase.appCheck().activate('6LflJxMuAAAAAGRmOz5QTdfUx5K__zqzAnC3BNQG', true); } }catch(e){}

var currentCode = null;
var video = document.getElementById('video');
var canvas = document.getElementById('canvas');
var ctx = canvas.getContext('2d');
var scanning = false;
var lastScan = 0;

function getParam(n){ return new URLSearchParams(location.search).get(n); }

function startCheckin(){
  var code = (document.getElementById('tokenCode').value||'').trim().toUpperCase() || getParam('t');
  if(!code || code.length < 4){ alert('Masukkan kode token'); return; }
  currentCode = code;
  document.getElementById('tokenInput').classList.add('hidden');
  document.getElementById('checkinUI').classList.remove('hidden');
  loadStats();
  startCamera();
}

function startCamera(){
  navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } })
    .then(function(stream){
      video.srcObject = stream;
      video.play();
      scanning = true;
      requestAnimationFrame(tick);
    })
    .catch(function(err){ showResult('error', '⚠️', 'Kamera tidak bisa diakses', 'Coba tombol "Coba Kamera Lagi" di bawah, atau upload foto QR / input manual.'); });
}

function tick(){
  if(!scanning) return;
  if(video.readyState === video.HAVE_ENOUGH_DATA){
    canvas.width = video.videoWidth;
    canvas.height = video.videoHeight;
    ctx.drawImage(video, 0, 0);
    var img = ctx.getImageData(0, 0, canvas.width, canvas.height);
    var qr = jsQR(img.data, canvas.width, canvas.height);
    if(qr && qr.data && Date.now() - lastScan > 2000){
      lastScan = Date.now();
      handleQR(qr.data);
    }
  }
  requestAnimationFrame(tick);
}

function handleQR(data){
  // QR format: INVITO:CODE:GUESTNAME or URL with params
  var guest = data;
  var m = data.match(/INVITO:([^:]+):(.+)/);
  if(m){ guest = decodeURIComponent(m[2]); }
  else {
    try {
      var u = new URL(data);
      guest = u.searchParams.get('to') || u.searchParams.get('g') || data;
    } catch(e){}
  }
  doCheckin(guest.trim());
}

function doCheckin(guestName){
  if(!guestName) return;
  /* Hanya nama terdaftar (daftar tamu + RSVP Hadir) yang boleh check-in.
     Kalau daftar belum termuat (halaman baru dibuka), biarkan lewat supaya
     scan sah tidak terblokir. */
  var exp = window.__expectedCheckin;
  if(exp && Object.keys(exp).length && !exp[guestName.trim().toLowerCase()]){
    showPopup(false, guestName, 'Nama tidak terdaftar untuk undangan ini. Periksa QR atau hubungi panitia.');
    showResult('error', '\u26a0\ufe0f', guestName, 'Nama tidak terdaftar untuk undangan ini.');
    return;
  }
  var col = db.collection('tokens').doc(currentCode).collection('checkins');
  // Cek dulu: nama ini sudah check-in belum? (1 QR = 1x check-in)
  col.get().then(function(snap){
    var key = guestName.trim().toLowerCase();
    var dup = null;
    snap.forEach(function(doc){ var d = doc.data()||{};
      if(((d.guest||'').trim()).toLowerCase() === key) dup = d;
    });
    if(dup){
      var tm = dup.at && dup.at.toDate ? dup.at.toDate().toLocaleTimeString('id-ID',{hour:'2-digit',minute:'2-digit'}) : '';
      showPopup(false, guestName, 'Sudah check-in sebelumnya' + (tm ? ' pukul ' + tm : '') + '. 1 QR hanya bisa 1x scan.');
      if(navigator.vibrate) navigator.vibrate([100,50,100]);
      return;
    }
    col.doc().set({
      guest: guestName,
      at: firebase.firestore.FieldValue.serverTimestamp(),
      by: 'scanner'
    }).then(function(){
      showPopup(true, guestName, 'Berhasil check-in! Nama sudah tercatat di bawah.');
      showResult('success', '✅', guestName, 'Berhasil check-in! Nama sudah tercatat di bawah.');
      loadStats();
    }).catch(function(){
      showResult('error', '⚠️', 'Gagal', 'Coba lagi.');
    });
  }).catch(function(){
    showResult('error', '⚠️', 'Gagal', 'Coba lagi.');
  });
}
function showPopup(ok, name, sub){
  var p = document.getElementById('scanPopup');
  var card = p.querySelector('.popup-card');
  document.getElementById('popupIcon').textContent = ok ? '✅' : '⚠️';
  document.getElementById('popupTitle').textContent = ok ? 'SCAN BERHASIL' : 'SUDAH CHECK-IN';
  document.getElementById('popupName').textContent = name;
  document.getElementById('popupSub').textContent = sub || '';
  card.className = 'popup-card' + (ok ? '' : ' warn');
  p.style.display = 'flex';
  if(ok && navigator.vibrate) navigator.vibrate(200);
}
function closePopup(){
  document.getElementById('scanPopup').style.display = 'none';
}
// Tutup popup kalau klik di luar kartu
document.getElementById('scanPopup').addEventListener('click', function(e){
  if(e.target === this) closePopup();
});

function manualCheckin(){
  var n = document.getElementById('manualName').value.trim();
  if(!n){ alert('Masukkan nama tamu'); return; }
  doCheckin(n);
  document.getElementById('manualName').value = '';
}

function renderCheckinList(snap){
  var ul = document.getElementById('checkinList');
  if(!ul) return;
  if(snap.empty){ ul.innerHTML = '<li class="empty">Belum ada yang check-in</li>'; return; }
  var html = '';
  snap.forEach(function(doc){
    var d = doc.data()||{};
    var tm = '';
    if(d.at && d.at.toDate){ tm = d.at.toDate().toLocaleTimeString('id-ID',{hour:'2-digit',minute:'2-digit'}); }
    html += '<li><span class="nm">' + escapeHtml(d.guest||'?') + '</span><span class="tm">' + tm + '</span></li>';
  });
  ul.innerHTML = html;
}
function escapeHtml(s){ return String(s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }

function showResult(type, icon, title, sub){
  var c = document.getElementById('resultCard');
  c.className = 'result-card show ' + type;
  c.innerHTML = '<div class="icon">'+icon+'</div><h2>'+title+'</h2><p>'+sub+'</p>';
  if(type === 'success' && navigator.vibrate) navigator.vibrate(200);
  // Sukses nempel sampai scan berikutnya; error hilang setelah 4 detik
  if(type !== 'success'){ setTimeout(function(){ c.classList.remove('show'); }, 4000); }
}

// Upload foto QR (fallback kalau kamera gak bisa)
document.getElementById('qrFile').addEventListener('change', function(e){
  var file = e.target.files[0];
  if(!file) return;
  var reader = new FileReader();
  reader.onload = function(ev){
    var img = new Image();
    img.onload = function(){
      var c = document.createElement('canvas');
      c.width = img.width; c.height = img.height;
      var cx = c.getContext('2d');
      cx.drawImage(img, 0, 0);
      try {
        var imgData = cx.getImageData(0, 0, c.width, c.height);
        var qr = jsQR(imgData.data, c.width, c.height);
        if(qr && qr.data){ handleQR(qr.data); }
        else { showResult('error', '⚠️', 'QR tidak terbaca', 'Coba foto yang lebih jelas / lebih dekat.'); }
      } catch(err){ showResult('error', '⚠️', 'Gagal membaca gambar', 'Coba foto lain.'); }
    };
    img.onerror = function(){ showResult('error', '⚠️', 'File tidak valid', 'Pilih gambar QR yang valid.'); };
    img.src = ev.target.result;
  };
  reader.readAsDataURL(file);
  e.target.value = '';
});

// Daftar tamu yang BELUM check-in (daftar tamu + RSVP Hadir, dikurangi yang sudah check-in)
function loadPending(guests){
  var col = db.collection('tokens').doc(currentCode);
  var expected = {};
  (guests||[]).forEach(function(g){ var k = (g||'').trim(); if(k) expected[k.toLowerCase()] = k; });
  col.collection('wishes').get().then(function(ws){
    ws.forEach(function(doc){ var w = doc.data()||{};
      var att = (w.attendance||'').toLowerCase();
      if(att.indexOf('hadir') > -1 && att.indexOf('berhalangan') === -1){
        var k = ((w.name||'').trim());
        if(k && !expected[k.toLowerCase()]) expected[k.toLowerCase()] = k;
      }
    });
    window.__expectedCheckin = expected;
    return col.collection('checkins').get();
  }).then(function(cs){
    var checked = {};
    cs.forEach(function(doc){ var g = ((doc.data()||{}).guest||'').trim().toLowerCase(); if(g) checked[g] = true; });
    var pending = Object.keys(expected).filter(function(k){ return !checked[k]; }).map(function(k){ return expected[k]; }).sort();
    var ul = document.getElementById('pendingList');
    var pc = document.getElementById('pendingCount');
    if(pc) pc.textContent = pending.length;
    if(!ul) return;
    if(!pending.length){ ul.innerHTML = '<li class="empty">🎉 Semua tamu sudah check-in!</li>'; return; }
    ul.innerHTML = pending.map(function(n){ return '<li><span class="nm">' + escapeHtml(n) + '</span><span class="tm">Belum hadir</span></li>'; }).join('');
  }).catch(function(){});
}

function loadStats(){
  if(!currentCode) return;
  db.collection('tokens').doc(currentCode).get().then(function(snap){
    var data = (snap.data()||{}).data||{};
    var guests = data.guests||[];
    loadPending(guests);
    // Tambah nama RSVP Hadir/Ragu yang belum ada di daftar tamu
    db.collection('tokens').doc(currentCode).collection('wishes').get().then(function(ws){
      var names = {};
      guests.forEach(function(g){ names[(g||'').trim().toLowerCase()] = true; });
      var extra = 0;
      ws.forEach(function(doc){ var w = doc.data()||{};
        var att = (w.attendance||'').toLowerCase();
        if(att.indexOf('hadir') > -1 && att.indexOf('berhalangan') === -1){
          var k = ((w.name||'').trim()).toLowerCase();
          if(k && !names[k]){ names[k] = true; extra++; }
        }
      });
      document.getElementById('statTotal').textContent = guests.length + extra;
    }).catch(function(){ document.getElementById('statTotal').textContent = guests.length; });
  });
  db.collection('tokens').doc(currentCode).collection('checkins').orderBy('at','desc').limit(30).get().then(function(snap){
    document.getElementById('statChecked').textContent = snap.size;
    renderCheckinList(snap);
  });
}

// Auto-start if token in URL
window.onload = function(){
  var t = getParam('t');
  if(t){ document.getElementById('tokenCode').value = t; startCheckin(); }
};
</script>
<div id="scanPopup" class="popup-overlay" style="display:none">
  <div class="popup-card">
    <div class="popup-icon" id="popupIcon">✅</div>
    <h2 id="popupTitle">SCAN BERHASIL</h2>
    <p id="popupName"></p>
    <p id="popupSub"></p>
    <button onclick="closePopup()">OK</button>
  </div>
</div>
</body>
</html>
