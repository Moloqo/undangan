<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" href="data:," />
    <title>Kelola Tamu — INVITO</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500;1,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <style>
      :root{
        --bg:#FBF8F3;
        --bg-soft:#F3EDE1;
        --card:#FFFFFF;
        --ink:#1C1A17;
        --ink-soft:#6E675C;
        --line:#E6DECF;
        --brand:#B98A2F;
        --brand-hover:#A67A28;
        --brand-ink:#FFFDF7;
        --gold:#B98A2F;
        --gold-soft:#F1E7CF;
        --sage:#7A8B6F;
        --sage-soft:#E9EEE3;
        --danger:#A52A21;
        --danger-bg:#F9EAE7;
        --ok:#55705C;
        --ok-bg:#E9EEE3;
        --input-bg:#FFFFFF;
        --shadow:0 1px 3px rgba(62,49,20,.04), 0 12px 32px rgba(62,49,20,.05);
        --shadow-lift:0 4px 10px rgba(62,49,20,.05), 0 24px 48px rgba(62,49,20,.10);
        --radius:16px;
      }
      @media (prefers-color-scheme: dark){
        :root{
          --bg:#171512;
          --bg-soft:#201D18;
          --card:#232019;
          --ink:#F1EBDD;
          --ink-soft:#B4AB99;
          --line:#38332A;
          --brand:#D2A94F;
          --brand-hover:#DFBA66;
          --brand-ink:#221A08;
          --gold:#D2A94F;
          --gold-soft:#37301C;
          --sage:#9DB08F;
          --sage-soft:#2A2F24;
          --danger:#FF9D94;
          --danger-bg:#3A201D;
          --ok:#A9C79B;
          --ok-bg:#26301F;
          --input-bg:#1B1915;
          --shadow:0 2px 6px rgba(0,0,0,.25), 0 14px 34px rgba(0,0,0,.35);
          --shadow-lift:0 4px 10px rgba(0,0,0,.3), 0 22px 44px rgba(0,0,0,.5);
        }
      }
      html{ scroll-behavior:smooth; -webkit-text-size-adjust:100%; text-size-adjust:100%; overflow-x:hidden; overflow-x:clip; }
      body{
        margin:0;
        background:var(--bg);
        color:var(--ink);
        font-family:"Inter", system-ui, -apple-system, sans-serif;
        font-size:16.5px;
        line-height:1.75;
        -webkit-font-smoothing:antialiased;
        overflow-x:hidden;
        overflow-x:clip;
      }
      *,*::before,*::after{ box-sizing:border-box; }
      img,svg,video{ max-width:100%; }
      a,button{ touch-action:manipulation; -webkit-tap-highlight-color:transparent; }
      .tcard h3,.tcard .desc,.preview-card dd,.code-display,.grid-head h2{ overflow-wrap:break-word; }
      ::selection{ background:var(--gold-soft); }
      h1,h2,h3,p,ul,ol,figure{ margin:0; }
      ul,ol{ padding:0; list-style:none; }
      button{ font:inherit; cursor:pointer; }
      input,select,textarea{ font:inherit; font-size:16px; color:var(--ink); }
      a{ color:var(--brand); }
      .wrap{ max-width:1100px; margin:0 auto; padding:0 22px; }
      .serif{ font-family:"Cormorant Garamond", Georgia, serif; }

      /* ---------- Header ---------- */
      .site-head{ position:sticky; top:0; z-index:45; background:color-mix(in srgb, var(--bg) 86%, transparent); -webkit-backdrop-filter:blur(14px); backdrop-filter:blur(14px); border-bottom:1px solid var(--line); }
      .site-head .wrap{ display:flex; align-items:center; gap:20px; min-height:66px; }
      .brand-logo{ display:block; height:36px; width:auto; }
      .site-nav{ margin-left:auto; display:flex; align-items:center; gap:6px; }
      .site-nav a{ display:inline-flex; align-items:center; min-height:44px; color:var(--ink-soft); text-decoration:none; font-size:14.5px; font-weight:500; padding:10px 13px; border-radius:999px; white-space:nowrap; transition:color .2s ease, background .2s ease; }
      @media (hover:hover){ .site-nav a:hover{ color:var(--ink); background:var(--bg-soft); } }
      .site-nav .nav-admin{ margin-left:8px; min-height:44px; padding:9px 20px; border-radius:999px; border:1px solid var(--line); background:transparent; color:var(--ink); font-weight:600; font-size:14.5px; transition:border-color .2s ease, background .2s ease; }
      @media (hover:hover){ .site-nav .nav-admin:hover{ border-color:var(--gold); } }
      @media (max-width:560px){
        .site-head .wrap{ min-height:58px; gap:8px; padding:0 16px; }
        .brand-logo{ height:30px; }
        .site-nav{ gap:2px; }
        .site-nav a{ padding:8px 7px; font-size:13px; }
        .site-nav a[href="#faq"]{ display:none; }
        .site-nav .nav-admin{ margin-left:4px; min-height:44px; padding:8px 14px; font-size:13px; }
      }

      /* ---------- Popup Promo ---------- */
      .promo-overlay{ position:fixed; inset:0; z-index:90; background:rgba(18,14,8,.68); display:none; align-items:center; justify-content:center; padding:20px; }
      .promo-overlay.show{ display:flex; }
      .promo-modal{ position:relative; width:100%; max-width:440px; max-height:calc(100dvh - 32px); overflow-y:auto; background:#1C1A17; color:#FFF8E7; border:1px solid var(--gold); border-radius:22px; padding:46px 36px 38px; text-align:center; box-shadow:0 30px 70px rgba(0,0,0,.45); animation:promoIn .45s cubic-bezier(.2,.9,.3,1.12); }
      .promo-modal .promo-close{ position:absolute; top:10px; right:10px; z-index:2; width:44px; height:44px; border-radius:50%; border:1px solid rgba(245,217,139,.35); background:rgba(255,248,231,.07); color:#FFF8E7; font-size:16px; line-height:1; display:flex; align-items:center; justify-content:center; transition:background .2s ease, transform .15s ease; }
      @media (hover:hover){ .promo-close:hover{ background:rgba(255,248,231,.16); } }
      .promo-close:active{ transform:scale(.93); }
      .promo-modal::before{ content:""; position:absolute; inset:0; background:radial-gradient(420px 220px at 50% -40px, rgba(185,138,47,.32), transparent 70%), radial-gradient(300px 160px at 90% 110%, rgba(185,138,47,.16), transparent 70%); pointer-events:none; }
      .promo-modal > *{ position:relative; }
      @keyframes promoIn{ from{ opacity:0; transform:translateY(16px) scale(.96); } to{ opacity:1; transform:none; } }
      @media (prefers-reduced-motion: reduce){ .promo-modal{ animation:none; } }
      @media (prefers-color-scheme: dark){ .promo-modal{ background:#0F0E0B; } }
      .promo-title{ font-family:"Cormorant Garamond", Georgia, serif; font-size:clamp(52px,13vw,64px); font-weight:700; letter-spacing:.14em; line-height:1; color:#F5D98B; padding-left:.14em; }
      .promo-rule{ display:flex; align-items:center; justify-content:center; gap:12px; margin:20px auto 22px; }
      .promo-rule::before,.promo-rule::after{ content:""; height:1px; width:52px; background:linear-gradient(90deg, transparent, var(--gold)); }
      .promo-rule::after{ background:linear-gradient(90deg, var(--gold), transparent); }
      .promo-rule span{ flex:none; width:7px; height:7px; background:var(--gold); transform:rotate(45deg); }
      .promo-old{ font-size:20px; line-height:1.3; color:rgba(255,248,231,.62); text-decoration:line-through; text-decoration-color:#E07856; text-decoration-thickness:2px; }
      .promo-new{ font-family:"Cormorant Garamond", Georgia, serif; font-size:clamp(54px,14vw,68px); font-weight:700; line-height:1.05; color:#F5D98B; margin-top:2px; }
      .promo-sub{ margin-top:12px; font-size:15.5px; line-height:1.6; color:rgba(255,248,231,.88); }
      .promo-cta{ margin-top:28px; display:inline-flex; align-items:center; justify-content:center; min-height:52px; padding:13px 34px; border:none; border-radius:999px; background:var(--gold); color:#221A08; font-size:16px; font-weight:700; letter-spacing:.02em; transition:background .2s ease, transform .15s ease; }
      @media (hover:hover){ .promo-cta:hover{ background:#D2A94F; } }
      .promo-cta:active{ transform:scale(.97); }
      @media (max-width:480px){
        .promo-overlay{ padding:14px; }
        .promo-modal{ padding:36px 20px 28px; border-radius:18px; }
        .promo-title{ font-size:44px; }
        .promo-rule{ margin:16px auto 18px; }
        .promo-old{ font-size:18px; }
        .promo-new{ font-size:50px; }
        .promo-sub{ font-size:15px; margin-top:10px; }
        .promo-cta{ width:100%; margin-top:24px; min-height:54px; }
      }
      .card-meta{ display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
      .card-meta .tag{ align-self:center; }

      /* ---------- Hero ---------- */
      .hero{ position:relative; padding:92px 0 58px; text-align:center; overflow:hidden; }
      .hero::before{ content:""; position:absolute; inset:0; pointer-events:none; background:
        radial-gradient(560px 300px at 50% -60px, var(--gold-soft), transparent 70%),
        repeating-linear-gradient(90deg, transparent 0 79px, color-mix(in srgb, var(--ink) 4%, transparent) 79px 80px); }
      .hero > *{ position:relative; }
      .hero .rule{ display:flex; align-items:center; justify-content:center; gap:16px; color:var(--gold); margin-bottom:26px; }
      .hero .rule::before,.hero .rule::after{ content:""; height:1px; width:56px; background:linear-gradient(90deg, transparent, var(--gold)); }
      .hero .rule::after{ background:linear-gradient(90deg, var(--gold), transparent); }
      .hero .rule span{ font-size:11.5px; letter-spacing:.38em; text-transform:uppercase; font-weight:600; padding-left:.38em; }
      .hero h1{ font-family:"Cormorant Garamond", Georgia, serif; font-weight:600; font-size:clamp(40px,6.4vw,62px); line-height:1.14; letter-spacing:.005em; }
      .hero h1 em{ font-style:italic; font-weight:500; color:var(--brand); }
      .hero .lead{ max-width:520px; margin:22px auto 0; color:var(--ink-soft); font-size:17px; line-height:1.75; }
      .hero .cta-row{ margin-top:34px; display:flex; flex-wrap:wrap; gap:12px; justify-content:center; }
      .hero .cta-row .btn{ min-height:52px; }
      .hero .stats{ margin-top:38px; display:flex; flex-wrap:wrap; gap:8px 26px; justify-content:center; }
      .hero .stats li{ position:relative; font-size:13.5px; font-weight:500; letter-spacing:.04em; color:var(--ink-soft); }
      .hero .stats li + li::before{ content:""; position:absolute; left:-15px; top:50%; width:4px; height:4px; border-radius:1px; background:var(--gold); transform:translateY(-50%) rotate(45deg); }
      .hero .stats b{ color:var(--ink); font-weight:700; }

      /* ---------- Section umum ---------- */
      .sec{ padding:76px 0 8px; scroll-margin-top:84px; }
      .sec-head{ text-align:center; max-width:560px; margin:0 auto 40px; }
      .sec-head .kick{ font-size:11.5px; letter-spacing:.32em; text-transform:uppercase; font-weight:600; color:var(--gold); }
      .sec-head h2{ font-family:"Cormorant Garamond", Georgia, serif; font-size:clamp(30px,4.6vw,40px); font-weight:600; line-height:1.2; margin-top:10px; }
      .sec-head p{ color:var(--ink-soft); font-size:15.5px; margin-top:10px; }

      /* ---------- Steps / Cara Pesan ---------- */
      .steps{ display:grid; grid-template-columns:repeat(3,1fr); gap:0; border-top:1px solid var(--line); border-bottom:1px solid var(--line); }
      .step{ padding:34px 28px 36px; text-align:center; }
      .step + .step{ border-left:1px solid var(--line); }
      .step .num{ font-family:"Cormorant Garamond",serif; font-size:32px; font-weight:500; font-style:italic; color:var(--gold); line-height:1; }
      .step h3{ font-size:15.5px; font-weight:600; letter-spacing:.02em; margin:14px 0 5px; }
      .step p{ color:var(--ink-soft); font-size:14.5px; line-height:1.65; }

      /* ---------- Fitur ---------- */
      .fitur-grid{ display:grid; grid-template-columns:repeat(4,1fr); gap:34px 30px; }
      .fitur{ text-align:left; }
      .fitur .ic{ width:48px; height:48px; border:1px solid var(--line); border-radius:50%; display:flex; align-items:center; justify-content:center; color:var(--sage); margin-bottom:16px; background:var(--card); }
      .fitur h3{ font-size:15.5px; font-weight:600; margin-bottom:5px; }
      .fitur p{ color:var(--ink-soft); font-size:14.5px; line-height:1.65; }
      @media (max-width:900px){ .fitur-grid{ grid-template-columns:repeat(2,1fr); } }
      @media (max-width:520px){ .fitur-grid{ grid-template-columns:1fr; gap:26px; } }

      /* ---------- FAQ ---------- */
      .faq-list{ max-width:720px; margin:0 auto; }
      .faq-item{ border-top:1px solid var(--line); }
      .faq-item:last-child{ border-bottom:1px solid var(--line); }
      .faq-item summary{ list-style:none; cursor:pointer; display:flex; align-items:center; gap:14px; min-height:56px; padding:14px 4px; font-family:"Cormorant Garamond", Georgia, serif; font-size:20px; font-weight:600; line-height:1.35; }
      .faq-item summary::-webkit-details-marker{ display:none; }
      .faq-item summary::after{ content:"+"; margin-left:auto; flex:none; font-family:"Inter",sans-serif; font-weight:400; font-size:22px; color:var(--gold); transition:transform .3s ease; }
      .faq-item[open ] summary::after{ transform:rotate(45deg); }
      .faq-item .faq-body{ padding:0 4px 20px; color:var(--ink-soft); font-size:15px; line-height:1.7; max-width:620px; }

      /* ---------- Filter ---------- */
      .toolbar{ margin:6px 0 34px; display:flex; flex-direction:column; align-items:center; gap:20px; scroll-margin-top:92px; }
      .searchbox{ position:relative; width:100%; max-width:520px; }
      .searchbox input{ width:100%; box-sizing:border-box; min-height:52px; border:1px solid var(--line); border-radius:999px; background:var(--input-bg); padding:12px 20px 12px 48px; transition:border-color .2s ease, box-shadow .2s ease; }
      .searchbox input:focus{ outline:none; border-color:var(--gold); box-shadow:0 0 0 4px var(--gold-soft); }
      .searchbox svg{ position:absolute; left:18px; top:50%; transform:translateY(-50%); color:var(--ink-soft); pointer-events:none; }
      .chips{ display:flex; flex-wrap:wrap; gap:8px; justify-content:center; }
      .chip{ min-height:44px; padding:9px 19px; border-radius:999px; border:1px solid var(--line); background:transparent; color:var(--ink-soft); font-weight:500; font-size:14px; transition:border-color .25s ease, color .25s ease, background .25s ease; }
      .chip:hover{ border-color:var(--gold); color:var(--ink); }
      .chip[aria-pressed="true"]{ background:var(--ink); border-color:var(--ink); color:var(--bg); }
      .chip .cnt{ opacity:.6; font-weight:600; }
      @media (max-width:760px){
        .chips{ flex-wrap:nowrap; width:100%; justify-content:flex-start; overflow-x:auto; overflow-y:hidden; padding:4px 2px 10px; margin:-4px -2px -10px; -webkit-overflow-scrolling:touch; scrollbar-width:none; }
        .chips::-webkit-scrollbar{ display:none; }
        .chip{ flex:none; min-height:44px; padding:10px 16px; font-size:13.5px; text-align:center; white-space:nowrap; }
      }

      /* ---------- Cards ---------- */
      .grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(min(100%,430px),1fr)); gap:36px; padding-bottom:12px; }
      .grid-head{ grid-column:1 / -1; display:flex; align-items:center; gap:16px; margin-top:44px; }
      .grid-head:first-child{ margin-top:8px; }
      .grid-head::before{ content:""; flex:none; width:7px; height:7px; background:var(--gold); transform:rotate(45deg); }
      .grid-head h2{ font-family:"Cormorant Garamond",serif; font-size:28px; font-weight:600; line-height:1.3; white-space:nowrap; }
      .grid-head .cnt{ color:var(--ink-soft); font-size:13.5px; font-weight:500; letter-spacing:.03em; white-space:nowrap; }
      .grid-head::after{ content:""; flex:1; height:1px; background:var(--line); align-self:center; min-width:24px; }
      .scene .cat-badge{ position:absolute; bottom:12px; left:12px; z-index:3; background:rgba(20,16,8,.55); color:#fff; font-size:10.5px; font-weight:600; letter-spacing:.16em; text-transform:uppercase; padding:5px 11px; border-radius:999px; pointer-events:none; backdrop-filter:blur(3px); }
      .tcard{ background:var(--card); border:1px solid var(--line); border-radius:var(--radius); overflow:hidden; box-shadow:var(--shadow); display:flex; flex-direction:column; transition:box-shadow .4s ease, border-color .4s ease, transform .4s ease; }
      @media (hover:hover){ .tcard:hover{ box-shadow:var(--shadow-lift); transform:translateY(-4px); } }
      .scene{ position:relative; aspect-ratio:1/1; display:flex; align-items:center; justify-content:center; overflow:hidden; }
      .scene .fs-badge{ position:absolute; top:12px; right:12px; z-index:3; display:inline-flex; align-items:center; gap:6px; background:rgba(20,16,8,.62); color:#fff; font-size:11.5px; font-weight:700; letter-spacing:.06em; padding:7px 12px; border-radius:999px; pointer-events:none; backdrop-filter:blur(3px); }
      .scene .fs-badge svg{ flex:none; }
      .scene .fs-open{ position:absolute; inset:0; z-index:4; width:100%; height:100%; border:none; background:transparent; padding:0; cursor:zoom-in; -webkit-tap-highlight-color:transparent; }
      .scene .fs-open:focus-visible{ outline:3px solid var(--gold); outline-offset:-3px; }
      .scene svg.motif{ width:104px; height:104px; position:relative; z-index:1; }
      .scene img.thumb{ position:absolute; inset:0; width:100%; height:100%; object-fit:cover; object-position:50% 0%; display:block; z-index:2; transition:transform .4s ease; }
      @media (hover:hover){ .tcard:hover .scene img.thumb{ transform:scale(1.03); } }
      .scene .frame{ position:absolute; inset:10px; border:1px solid rgba(255,255,255,.28); border-radius:8px; pointer-events:none; }
      .scene .grain{ position:absolute; inset:0; opacity:.16; background-image:radial-gradient(rgba(255,255,255,.9) 1px, transparent 1.4px); background-size:14px 14px; }
      .scene.pixel .grain{ background-image:linear-gradient(rgba(255,255,255,.55) 1px, transparent 1px),linear-gradient(90deg, rgba(255,255,255,.55) 1px, transparent 1px); background-size:16px 16px; opacity:.12; }
      .tcard .body{ padding:26px 26px 28px; display:flex; flex-direction:column; gap:9px; flex:1; }
      .tcard h3{ font-family:"Cormorant Garamond",serif; font-size:26px; font-weight:600; line-height:1.25; }
      .tcard .tag{ align-self:flex-start; color:var(--gold); border:1px solid var(--line); background:var(--bg); border-radius:999px; padding:4px 12px; font-weight:600; font-size:11px; letter-spacing:.14em; text-transform:uppercase; }
      .tcard .desc{ color:var(--ink-soft); font-size:14.5px; line-height:1.7; flex:1; }
      .tcard .actions{ display:flex; align-items:center; gap:10px; margin-top:18px; padding-top:18px; border-top:1px solid var(--line); }
      .empty-note{ text-align:center; color:var(--ink-soft); padding:34px 0; }

      /* ---------- Buttons ---------- */
      .btn{ display:inline-flex; align-items:center; justify-content:center; gap:8px; min-height:48px; padding:11px 24px; border-radius:999px; border:1px solid transparent; font-weight:600; font-size:15px; letter-spacing:.01em; text-decoration:none; transition:background .3s ease, border-color .3s ease, color .3s ease, transform .15s ease; }
      .btn:active{ transform:scale(.98); }
      .btn.primary{ background:var(--brand); color:var(--brand-ink); min-height:52px; }
      @media (hover:hover){ .btn.primary:hover{ background:var(--brand-hover); } }
      .btn.ghost{ background:transparent; border-color:var(--line); color:var(--ink); font-weight:500; }
      @media (hover:hover){ .btn.ghost:hover{ border-color:var(--gold); } }
      .btn.gold{ background:var(--gold); color:#FFFDF7; min-height:52px; }
      @media (prefers-color-scheme: dark){ .btn.gold{ color:#221A08; } }
      .btn.wa-buy{ background:var(--gold); color:#FFFDF7; min-height:52px; }
      @media (hover:hover){ .btn.wa-buy:hover{ background:var(--brand-hover); } }
      @media (prefers-color-scheme: dark){ .btn.wa-buy{ color:#221A08; } }
      .btn.wa-buy svg{ flex:none; }
      .btn.danger{ background:var(--danger-bg); color:var(--danger); border-color:var(--danger); }
      .btn.small{ min-height:48px; padding:10px 18px; font-size:14px; }
      .btn.demo{ min-height:48px; padding:10px 4px; border:none; border-radius:0; background:transparent; color:var(--brand); font-weight:600; font-size:14.5px; letter-spacing:.02em; white-space:nowrap; }
      .btn.demo::after{ content:"→"; margin-left:2px; transition:transform .25s ease; }
      @media (hover:hover){ .btn.demo:hover::after{ transform:translateX(3px); } }
      .btn[disabled]{ opacity:.55; pointer-events:none; }
      .btn.flex{ flex:1; }

      /* ---------- Panels / forms ---------- */
      .panel{ background:var(--card); border:1px solid var(--line); border-radius:var(--radius); box-shadow:var(--shadow); padding:42px; margin:44px 0; }
      .panel h2{ font-family:"Cormorant Garamond",serif; font-size:32px; font-weight:600; line-height:1.25; }
      .panel .sub{ color:var(--ink-soft); margin-top:6px; max-width:640px; font-size:15.5px; }
      .token-row{ display:flex; gap:12px; margin-top:22px; flex-wrap:wrap; }
      .token-row select,.token-row input{ min-height:54px; border:1px solid var(--line); border-radius:13px; background:var(--input-bg); padding:12px 16px; box-sizing:border-box; }
      .token-row select{ flex:1 1 220px; }
      .token-row input{ flex:1 1 200px; text-transform:uppercase; letter-spacing:.14em; font-weight:700; }
      .msg{ margin-top:16px; border-radius:12px; padding:13px 16px; font-size:15px; line-height:1.6; display:none; }
      .msg.show{ display:block; }
      .msg.err{ background:var(--danger-bg); color:var(--danger); }
      .msg.ok{ background:var(--ok-bg); color:var(--ok); }

      .backlink{ display:inline-flex; align-items:center; gap:8px; min-height:48px; background:none; border:none; color:var(--brand); font-weight:700; padding:8px 0; }
      .form-grid{ display:grid; grid-template-columns:1fr 1fr; gap:22px; margin-top:28px; }
      .field{ display:flex; flex-direction:column; gap:8px; }
      .field.full{ grid-column:1 / -1; }
      .field label{ font-weight:600; font-size:14.5px; }
      .field .hint{ font-weight:400; color:var(--ink-soft); font-size:13px; line-height:1.55; }
      .field input,.field textarea{ min-height:52px; border:1px solid var(--line); border-radius:12px; background:var(--input-bg); padding:11px 14px; box-sizing:border-box; width:100%; }
      .field textarea{ min-height:88px; resize:vertical; line-height:1.6; }
      .field input[type="file"]{ padding:10px 14px; }
      .thumbrow{ display:flex; align-items:center; gap:12px; }
      .thumb{ width:64px; height:64px; border-radius:10px; object-fit:cover; border:1px solid var(--line); display:none; }
      .thumb.show{ display:block; }
      .progress{ height:8px; border-radius:99px; background:var(--bg-soft); overflow:hidden; display:none; }
      .progress.show{ display:block; }
      .progress i{ display:block; height:100%; width:0%; background:var(--gold); transition:width .2s ease; }
      .gallery-thumbs{ display:flex; flex-wrap:wrap; gap:8px; }
      .gallery-thumbs img{ width:56px; height:56px; object-fit:cover; border-radius:8px; border:1px solid var(--line); }
      fieldset{ border:1px solid var(--line); border-radius:14px; padding:22px; margin:0; }
      legend{ font-weight:700; padding:0 8px; font-size:15px; }
      .dynamic-list{ display:flex; flex-direction:column; gap:20px; margin-top:8px; }
      .dynamic-item{ border:1px solid var(--line); border-radius:14px; padding:20px; background:var(--card); }
      .dynamic-item-head{ display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:14px; }
      .dynamic-item-head strong{ font-size:15.5px; line-height:1.4; }
      .btn-remove{ min-height:48px; padding:10px 16px; border-radius:10px; border:1px solid var(--danger); background:var(--danger-bg); color:var(--danger); font-weight:700; font-size:14px; flex:none; }
      .btn-remove[disabled]{ opacity:.45; pointer-events:none; }
      .btn-add{ width:100%; margin-top:14px; min-height:50px; border-radius:12px; border:1.5px dashed var(--gold); background:var(--gold-soft); color:var(--ink); font-weight:700; font-size:15.5px; padding:12px 16px; }
      .dynamic-actions{ display:flex; gap:8px; flex-wrap:wrap; justify-content:flex-end; }
      .btn-move{ min-height:48px; min-width:48px; padding:10px 14px; border-radius:10px; border:1px solid var(--line); background:var(--bg-soft); color:var(--ink); font-weight:700; font-size:15px; flex:none; }
      .btn-move[disabled]{ opacity:.4; pointer-events:none; }
      @media (max-width:760px){ .dynamic-item-head{ flex-wrap:wrap; } .dynamic-actions{ width:100%; } .dynamic-actions .btn-remove{ flex:1; } .dynamic-actions .btn-move{ flex:1; } }

      /* ---------- Teks Template (Fase 2) ---------- */
      .txt-group{ margin-top:22px; }
      .txt-group h4{ font-size:13px; font-weight:700; letter-spacing:.09em; text-transform:uppercase; color:var(--brand); margin:0; }
      .txt-group .form-grid{ margin-top:10px; gap:16px 22px; }
      #textsFormWrap .field textarea{ min-height:72px; }

      .preview-card{ background:var(--bg-soft); border:1px dashed var(--gold); border-radius:14px; padding:24px; margin-top:32px; }
      .preview-card h3{ font-family:"Cormorant Garamond",serif; font-size:23px; font-weight:600; margin-bottom:10px; }
      .preview-card dl{ display:grid; grid-template-columns:150px 1fr; gap:5px 14px; font-size:14.5px; margin:0; }
      .preview-card dt{ color:var(--ink-soft); font-weight:600; }
      .preview-card dd{ margin:0; font-weight:600; word-break:break-word; }

      .link-box{ margin-top:28px; background:var(--ok-bg); border:1px solid var(--ok); border-radius:14px; padding:22px; display:none; }
      .link-box.show{ display:block; }
      .link-box .url{ word-break:break-all; font-weight:600; font-size:14.5px; line-height:1.6; margin:8px 0 14px; }
      .link-box h3{ color:var(--ok); font-size:17px; }
      .export-box{ margin-top:28px; background:var(--card); border:1px solid var(--gold); border-radius:14px; padding:24px; display:none; }
      .export-box.show{ display:block; }
      .export-box h3{ font-family:"Cormorant Garamond",serif; font-size:23px; font-weight:600; margin-bottom:8px; }
      .export-box p{ color:var(--ink-soft); font-size:14.5px; line-height:1.7; }
      .export-box .row{ display:flex; gap:10px; flex-wrap:wrap; margin-top:16px; }
      .host-guide{ margin-top:18px; border-top:1px solid var(--line); padding-top:16px; display:none; }
      .host-guide.show{ display:block; }
      .host-guide h4{ font-size:15.5px; margin:0 0 8px; }
      .host-guide ol{ list-style:decimal; padding-left:22px; display:flex; flex-direction:column; gap:10px; font-size:14.5px; line-height:1.7; color:var(--ink-soft); }
      .host-guide ol b{ color:var(--ink); }
      .host-guide .host-opts{ display:grid; grid-template-columns:1fr 1fr 1fr; gap:10px; margin:14px 0; }
      .host-guide .host-opt{ border:1px solid var(--line); border-radius:12px; padding:13px 14px; background:var(--bg-soft); }
      .host-guide .host-opt strong{ display:block; font-size:14.5px; color:var(--ink); margin-bottom:3px; }
      .host-guide .host-opt span{ font-size:13px; line-height:1.55; display:block; }
      @media (max-width:760px){ .host-guide .host-opts{ grid-template-columns:1fr; } }

      /* ---------- Admin ---------- */
      .admin-grid{ display:grid; grid-template-columns:1fr 1fr; gap:20px; margin-top:22px; }
      .code-display{ font-size:26px; letter-spacing:.22em; font-weight:800; text-align:center; background:var(--bg-soft); border:1.5px dashed var(--gold); border-radius:12px; padding:14px 8px; margin:14px 0; min-height:34px; }
      .history-list li{ display:flex; flex-wrap:wrap; gap:6px 12px; align-items:baseline; border-bottom:1px solid var(--line); padding:11px 0; font-size:14.5px; }
      .history-list .code{ font-weight:800; letter-spacing:.1em; }
      .history-list .meta{ color:var(--ink-soft); }
      .badge{ font-size:12px; font-weight:800; letter-spacing:.08em; text-transform:uppercase; border-radius:999px; padding:3px 10px; }
      .badge.active{ background:var(--ok-bg); color:var(--ok); }
      .badge.revoked{ background:var(--danger-bg); color:var(--danger); }
      .rev-info{ margin-top:16px; border:1px solid var(--line); background:var(--bg-soft); border-radius:12px; padding:13px 16px; font-size:15px; font-weight:600; display:none; }
      .rev-info.show{ display:block; }
      .rev-info.low{ border-color:var(--gold); }
      .rev-info.empty{ background:var(--danger-bg); color:var(--danger); border-color:var(--danger); }
      .checkrow{ display:flex; align-items:center; gap:10px; min-height:52px; font-weight:600; font-size:15px; cursor:pointer; }
      .checkrow input{ width:20px; height:20px; min-height:20px; accent-color:var(--brand); flex:none; }
      .field input[type="number"]{ min-height:52px; border:1px solid var(--line); border-radius:12px; background:var(--input-bg); padding:11px 14px; box-sizing:border-box; width:100%; }
      .field select{ min-height:52px; border:1px solid var(--line); border-radius:12px; background:var(--input-bg); padding:11px 14px; width:100%; box-sizing:border-box; }
      .history-list .actions-row{ display:flex; gap:8px; flex-wrap:wrap; margin-left:auto; }
      .history-toolbar{ display:flex; align-items:center; gap:12px; flex-wrap:wrap; margin:14px 0 4px; }
      .history-sync{ flex:1 1 240px; font-size:13.5px; line-height:1.6; color:var(--ink-soft); }
      .history-sync.ok{ color:var(--ok); font-weight:600; }
      .history-sync.err{ color:var(--danger); font-weight:600; }
      .admin-cta{ margin-top:14px; }

      /* ---------- WA konsultasi ngambang ---------- */
      .wa-float{ position:fixed; right:18px; bottom:calc(18px + env(safe-area-inset-bottom)); z-index:40; display:inline-flex; align-items:center; gap:9px; background:#1da851; color:#fff; text-decoration:none; font-weight:600; font-size:14.5px; line-height:1.3; padding:11px 19px 11px 14px; border-radius:999px; box-shadow:0 8px 22px rgba(10,60,30,.28); min-height:50px; }
      .wa-float svg{ flex:none; }
      .wa-float:active{ transform:scale(.97); }
      @media (max-width:480px){
        .wa-float{ right:14px; width:58px; height:58px; min-height:58px; padding:0; justify-content:center; border-radius:50%; }
        .wa-float span{ display:none; }
      }

      /* ---------- Daftar tamu & link personal ---------- */
      .guest-head{ display:flex; align-items:center; justify-content:space-between; gap:10px; margin-top:16px; flex-wrap:wrap; }
      .guest-head strong{ font-size:15px; }
      .guest-list{ display:flex; flex-direction:column; gap:10px; margin-top:12px; }
      .guest-row{ border:1px solid var(--line); border-radius:12px; padding:12px 14px; background:var(--bg-soft); }
      .guest-top{ display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
      .guest-top .gname{ font-weight:700; flex:1 1 130px; min-width:0; word-break:break-word; line-height:1.45; }
      .guest-url{ margin-top:8px; font-size:12.5px; line-height:1.55; color:var(--ink-soft); word-break:break-all; }
      .btn.wa-share{ background:#1da851; color:#fff; }

      /* ---------- Buku tamu & kartu QR ---------- */
      .book{ margin-top:26px; }
      .book-cover{ text-align:center; border:1px solid var(--gold); border-radius:14px; padding:52px 26px; background:var(--bg-soft); }
      .book-cover .book-title{ font-family:"Cormorant Garamond",serif; font-size:34px; font-weight:600; line-height:1.25; }
      .book-cover .book-couple{ font-family:"Cormorant Garamond",serif; font-size:27px; font-weight:600; margin-top:20px; color:var(--brand); line-height:1.35; }
      .book-cover .book-date{ color:var(--ink-soft); margin-top:6px; font-size:15.5px; }
      .wish-block{ border-bottom:1px solid var(--line); padding:20px 4px; transition:opacity .15s ease; }
      .wish-block.excluded{ opacity:.42; }
      .wish-head{ display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
      .wish-name{ font-size:16.5px; }
      .wish-badge{ background:var(--gold-soft); color:var(--ink); text-transform:none; letter-spacing:.02em; font-size:12.5px; }
      .wish-toggle{ margin-left:auto; display:inline-flex; align-items:center; gap:7px; font-size:13.5px; font-weight:600; color:var(--ink-soft); cursor:pointer; min-height:44px; padding:4px 2px; }
      .wish-toggle input{ width:19px; height:19px; min-height:19px; accent-color:var(--brand); flex:none; }
      .wish-text{ margin-top:6px; line-height:1.7; white-space:pre-wrap; word-break:break-word; }
      .wish-date{ margin-top:6px; font-size:13px; color:var(--ink-soft); }
      .qr-grid{ display:grid; grid-template-columns:repeat(2,1fr); gap:16px; margin-top:24px; }
      .qr-card{ border:1.5px dashed var(--ink-soft); border-radius:6px; padding:26px 18px; text-align:center; background:var(--card); }
      .qr-to{ font-size:13.5px; color:var(--ink-soft); letter-spacing:.04em; }
      .qr-name{ font-weight:700; font-size:17px; line-height:1.4; margin-top:2px; word-break:break-word; }
      .qr-box{ display:flex; align-items:center; justify-content:center; margin:16px auto 6px; min-height:168px; }
      .qr-box img{ display:block; }
      .qr-couple{ font-family:"Cormorant Garamond",serif; font-weight:600; font-size:21px; line-height:1.35; margin-top:8px; }
      .qr-scan{ font-size:13px; color:var(--ink-soft); margin-top:2px; }
      @media (max-width:560px){ .qr-grid{ grid-template-columns:1fr; } }

      /* ---------- Cetak: hanya area buku tamu / kartu QR ---------- */
      @media print{
        @page{ size:A4; margin:12mm; }
        body{ background:#fff; }
        .no-print,.wa-float,.toast,.overlay,.pv-overlay,.fs-overlay,.promo-overlay,.site-head{ display:none !important; }
        #viewGuestBook,#viewQrCards{ color:#1C1A17; }
        #viewGuestBook .wrap,#viewQrCards .wrap{ max-width:none; padding:0; }
        #viewGuestBook .panel,#viewQrCards .panel{ border:none; box-shadow:none; padding:0; margin:0; background:#fff; }
        .book{ margin-top:0; }
        .book-cover{ background:#fff; break-after:page; page-break-after:always; }
        .wish-block{ break-inside:avoid; page-break-inside:avoid; }
        .wish-block.excluded{ display:none !important; }
        .wish-badge{ background:#F1E7CF; color:#1C1A17; }
        .qr-grid{ grid-template-columns:repeat(2,1fr); margin-top:0; }
        .qr-card{ background:#fff; break-inside:avoid; page-break-inside:avoid; }
      }

      /* ---------- Footer / modal / toast ---------- */
      footer{ border-top:1px solid var(--line); margin-top:76px; padding:44px 0 56px; text-align:center; color:var(--ink-soft); font-size:14.5px; }
      footer .f-logo{ display:block; height:48px; width:auto; margin:0 auto; }
      footer .f-links{ margin-top:16px; display:flex; flex-wrap:wrap; gap:8px 22px; justify-content:center; align-items:center; }
      footer .f-links a{ display:inline-flex; align-items:center; min-height:44px; padding:6px 4px; color:var(--ink-soft); text-decoration:none; font-weight:500; }
      @media (hover:hover){ footer .f-links a:hover{ color:var(--brand); } }
      footer .f-copy{ margin-top:18px; font-size:13.5px; }
      .admin-link{ background:none; border:none; color:var(--ink-soft); text-decoration:underline; min-height:48px; padding:10px 14px; font-size:14px; }
      .overlay{ position:fixed; inset:0; background:rgba(18,14,8,.55); display:none; align-items:flex-end; justify-content:center; z-index:50; padding:0; overflow-y:auto; overscroll-behavior:contain; }
      .overlay.show{ display:flex; }
      .sheet{ background:var(--card); color:var(--ink); width:100%; max-width:480px; border-radius:22px 22px 0 0; padding:28px 26px calc(28px + env(safe-area-inset-bottom)); box-shadow:var(--shadow); max-height:calc(100dvh - 12px); overflow-y:auto; }
      .sheet form{ margin:0; }
      .sheet .msg{ margin:0 0 14px; text-align:left; }
      .sheet h3{ font-family:"Cormorant Garamond",serif; font-size:28px; font-weight:600; margin-bottom:6px; }
      .sheet p{ color:var(--ink-soft); font-size:15px; }
      .sheet input{ width:100%; box-sizing:border-box; min-height:54px; border:1px solid var(--line); border-radius:12px; background:var(--input-bg); padding:12px 16px; margin:18px 0 14px; text-align:center; letter-spacing:.3em; font-weight:800; font-size:20px; }
      .sheet .row{ display:flex; gap:10px; }
      .toast{ position:fixed; left:50%; bottom:calc(26px + env(safe-area-inset-bottom)); transform:translate(-50%,80px); background:var(--ink); color:var(--bg); padding:13px 22px; border-radius:999px; font-weight:600; font-size:14.5px; z-index:60; transition:transform .25s ease; max-width:calc(100vw - 40px); text-align:center; pointer-events:none; }
      .toast.show{ transform:translate(-50%,0); }

      /* ---------- Preview realtime ---------- */
      .pv-overlay{ position:fixed; inset:0; z-index:55; background:rgba(18,14,8,.78); display:none; flex-direction:column; }
      .pv-overlay.show{ display:flex; }
      .pv-bar{ display:flex; align-items:center; gap:12px; background:var(--card); color:var(--ink); border-bottom:1px solid var(--line); padding:10px 14px; padding-top:calc(10px + env(safe-area-inset-top)); }
      .pv-title{ font-family:"Cormorant Garamond",serif; font-weight:600; font-size:21px; line-height:1.3; flex:1; min-width:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
      .pv-status{ font-size:12.5px; font-weight:700; color:var(--ok); background:var(--ok-bg); border-radius:999px; padding:5px 12px; white-space:nowrap; }
      .pv-close{ width:48px; height:48px; flex:none; border-radius:12px; border:1px solid var(--line); background:var(--bg-soft); color:var(--ink); font-size:19px; font-weight:700; line-height:1; }
      .pv-dock{ height:48px; flex:none; border-radius:12px; border:1px solid var(--line); background:var(--bg-soft); color:var(--ink); font-size:14px; font-weight:700; padding:0 14px; white-space:nowrap; }
      .pv-overlay.docked{ background:transparent; pointer-events:none; }
      .pv-overlay.docked .pv-bar{ margin-top:auto; pointer-events:auto; box-shadow:0 -8px 28px rgba(18,14,8,.35); }
      .pv-overlay.docked .pv-body{ flex:0 0 46dvh; pointer-events:auto; background:rgba(18,14,8,.78); }
      .pv-body{ flex:1; min-height:0; display:flex; align-items:stretch; justify-content:center; }
      .pv-body iframe{ width:min(430px,100%); height:100%; border:0; display:block; background:#fff; }

      /* ---------- Fullscreen landing page ---------- */
      .fs-overlay{ position:fixed; inset:0; z-index:80; height:100dvh; background:#100d08; display:none; flex-direction:column; }
      .fs-overlay.show{ display:flex; }
      .fs-bar{ flex:none; display:flex; align-items:center; gap:12px; background:var(--card); color:var(--ink); border-bottom:1px solid var(--line); padding:10px 14px; padding-top:calc(10px + env(safe-area-inset-top)); }
      .fs-head{ flex:1; min-width:0; }
      .fs-title{ display:block; font-family:"Cormorant Garamond",serif; font-weight:600; font-size:21px; line-height:1.25; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
      .fs-sub{ display:block; font-size:12px; line-height:1.4; color:var(--ink-soft); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
      .fs-close{ width:48px; height:48px; flex:none; border-radius:12px; border:1px solid var(--line); background:var(--bg-soft); color:var(--ink); font-size:19px; font-weight:700; line-height:1; }
      .fs-body{ flex:1; min-height:0; position:relative; background:#100d08; }
      .fs-body iframe{ position:relative; z-index:2; width:100%; height:100%; border:0; display:block; background:#fff; opacity:0; transition:opacity .25s ease; }
      .fs-body iframe.ready{ opacity:1; }
      .fs-poster{ position:absolute; inset:0; z-index:1; width:100%; height:100%; object-fit:cover; object-position:50% 0%; opacity:.55; display:block; }
      .fs-loading{ position:absolute; z-index:3; left:50%; top:50%; transform:translate(-50%,-50%); text-align:center; color:#f3ecdc; background:rgba(16,13,8,.72); border-radius:14px; font-size:15px; line-height:1.6; padding:16px 22px; max-width:min(320px, calc(100vw - 56px)); pointer-events:none; }
      .fs-loading.hide{ display:none; }
      .fs-foot{ flex:none; display:flex; align-items:center; gap:10px; background:var(--card); border-top:1px solid var(--line); padding:12px 14px; padding-bottom:calc(12px + env(safe-area-inset-bottom)); }
      .fs-foot .btn{ min-height:52px; }
      @media (max-width:480px){ .fs-foot .btn.demo-open{ display:none; } }
      .pv-loading{ align-self:center; text-align:center; color:#f3ecdc; font-size:15.5px; line-height:1.7; padding:24px; max-width:340px; }
      input:focus, select:focus, textarea:focus{ outline:none; border-color:var(--gold); box-shadow:0 0 0 4px var(--gold-soft); }
      [hidden]{ display:none !important; }

      /* ---------- Animasi masuk (halus) ----------
         Elemen selalu terlihat penuh secara default; saat masuk viewport,
         kelas .in memicu animasi naik sekali jalan. Tidak ada state
         tersembunyi yang menetap, jadi konten tidak pernah tertahan. */
      @keyframes rvRise{ from{ opacity:0; transform:translateY(16px); } to{ opacity:1; transform:none; } }
      .rv-on .rv.in{ animation:rvRise .7s ease both; }
      @media (prefers-reduced-motion: reduce){
        html{ scroll-behavior:auto; }
        .rv-on .rv.in{ animation:none; }
        *,*::before,*::after{ transition-duration:.01ms !important; }
      }

      @media (max-width:760px){
        .steps{ grid-template-columns:1fr; }
        .step{ padding:26px 20px 28px; }
        .step + .step{ border-left:none; border-top:1px solid var(--line); }
        .form-grid{ grid-template-columns:1fr; }
        .admin-grid{ grid-template-columns:1fr; }
        .panel{ padding:30px 20px; margin:30px 0; }
        .preview-card dl{ grid-template-columns:1fr; gap:1px; }
        .preview-card dd{ margin-bottom:8px; }
        .hero{ padding:58px 0 42px; }
        .sec{ padding:52px 0 4px; }
        .grid{ gap:28px; }
        .grid-head{ margin-top:34px; }
        .tcard .actions{ gap:8px; flex-wrap:wrap; }
        .tcard .actions .btn.primary,.tcard .actions .btn.wa-buy{ padding:10px 16px; font-size:14.5px; }
        .tcard .actions .btn.demo{ font-size:13.5px; }
        .token-row{ flex-direction:column; }
        .token-row select,.token-row input{ flex:none; width:100%; }
        .token-row .btn{ width:100%; min-height:50px; }
        fieldset{ padding:18px 16px; }
        footer{ margin-top:56px; }
      }
      @media (min-width:761px){
        .overlay{ align-items:center; padding:20px; }
        .sheet{ border-radius:22px; }
      }

      /* ---------- Layar kecil (≤480px): kartu & tipografi proporsional ---------- */
      @media (max-width:480px){
        .wrap{ padding:0 16px; }
        .hero{ padding:50px 0 38px; }
        .hero h1{ font-size:clamp(33px,9.4vw,40px); line-height:1.18; }
        .hero .lead{ font-size:16px; }
        .hero .rule::before,.hero .rule::after{ width:34px; }
        .hero .cta-row .btn{ flex:1 1 100%; }
        .sec-head h2{ font-size:29px; }
        .grid{ gap:22px; }
        .grid-head{ gap:12px; }
        .grid-head h2{ font-size:23px; }
        .grid-head .cnt{ font-size:12.5px; }
        .tcard .body{ padding:20px 18px 22px; gap:8px; }
        .tcard h3{ font-size:23px; }
        .tcard .desc{ font-size:14px; }
        .tcard .actions .btn{ flex:1 1 auto; }
        .tcard .actions .btn.demo{ flex:0 1 auto; }
        .panel h2{ font-size:27px; }
        .sheet{ padding:24px 18px calc(24px + env(safe-area-inset-bottom)); }

<script>
var KT2 = { tab: 'ringkasan', code: null, data: null };
var KT2_TABS = [
  { id: 'ringkasan', icon: '📊', label: 'Ringkasan' },
  { id: 'tamu', icon: '👥', label: 'Daftar Tamu', badge: 'tamu' },
  { id: 'rsvp', icon: '✅', label: 'Konfirmasi Hadir', badge: 'rsvp' },
  { id: 'checkin', icon: '📷', label: 'Check-in' },
  { id: 'ucapan', icon: '💬', label: 'Ucapan', badge: 'ucapan' },
  { id: 'bagikan', icon: '🔗', label: 'Bagikan' },
];

function kt2Open(code, data, revisionsUsed){
  KT2.code = code; KT2.data = data || {}; KT2.revisionsUsed = revisionsUsed || 0;
  var d = KT2.data;
  var names = [d.groomName, d.brideName].filter(Boolean).join(' & ') || 'Mempelai';
  document.getElementById('kt2Names').textContent = names;
  document.getElementById('kt2Date').textContent = 'Kode: ' + code;
  renderKt2Nav();
  kt2Show('ringkasan');
  document.getElementById('kt2').classList.add('show');
  document.body.style.overflow = 'hidden';
}
function kt2Close(){
  document.getElementById('kt2').classList.remove('show');
  document.body.style.overflow = '';
}
function renderKt2Nav(){
  var nav = document.getElementById('kt2Nav'); nav.innerHTML = '';
  var counts = kt2Counts();
  KT2_TABS.forEach(function(t){
    var b = document.createElement('button');
    b.className = KT2.tab === t.id ? 'active' : '';
    var badge = t.badge && counts[t.badge] ? '<span class="bdg">'+counts[t.badge]+'</span>' : '';
    b.innerHTML = '<span class="ic">'+t.icon+'</span><span class="lbl">'+t.label+'</span>' + badge;
    b.onclick = function(){ kt2Show(t.id); };
    nav.appendChild(b);
  });
}
function kt2Counts(){
  var d = KT2.data || {};
  var guests = d.guests || [];
  return { tamu: guests.length, rsvp: 0, ucapan: 0 };
}
function kt2Show(tab){
  KT2.tab = tab;
  renderKt2Nav();
  var main = document.getElementById('kt2Main');
  var fn = { ringkasan: kt2Ringkasan, tamu: kt2Tamu, rsvp: kt2Rsvp, checkin: kt2Checkin, ucapan: kt2Ucapan, bagikan: kt2Bagikan }[tab];
  main.innerHTML = '';
  if(fn) fn(main);
}
function kt2Ringkasan(main){
  var d = KT2.data || {};
  var guests = d.guests || [];
  var sent = Object.keys(d.sentGuests || {}).length;
  main.innerHTML =
    '<div class="kt2-head"><div><h1>Ringkasan</h1><p>Selamat datang di dashboard kelola tamu</p></div></div>' +
    '<div class="kt2-cards">' +
    '<div class="kt2-card"><div class="lbl">Total Tamu</div><div class="val">'+guests.length+'</div><div class="sub">'+sent+' link terkirim</div></div>' +
    '<div class="kt2-card gold"><div class="lbl">Check-in</div><div class="val" id="kt2CheckinCount">-</div><div class="sub"><a href="checkin.html?t='+KT2.code+'" target="_blank" style="color:#b98a2f">Buka scanner →</a></div></div>' +
    '<div class="kt2-card"><div class="lbl">RSVP Masuk</div><div class="val" id="kt2RsvpCount">-</div><div class="sub">konfirmasi kehadiran</div></div>' +
    '<div class="kt2-card"><div class="lbl">Ucapan</div><div class="val" id="kt2WishCount">-</div><div class="sub">pesan dari tamu</div></div>' +
    '</div>' +
    '<div class="kt2-section"><h3>⚡ Aksi Cepat</h3>' +
    '<div style="display:flex;gap:10px;flex-wrap:wrap">' +
    '<button class="kt2-btn dark" onclick="kt2Show(\'tamu\')">Kelola Tamu</button>' +
    '<button class="kt2-btn line" onclick="kt2Show(\'bagikan\')">Bagikan Undangan</button>' +
    '<a class="kt2-btn line" href="checkin.html?t='+KT2.code+'" target="_blank">Scanner Check-in</a>' +
    '</div></div>';
  kt2LoadStats();
}
function kt2LoadStats(){
  if(!window.db || !KT2.code) return;
  var ref = db.collection('tokens').doc(KT2.code);
  ref.collection('wishes').get().then(function(s){
    var rsvpN = 0, wishN = 0;
    s.forEach(function(doc){ var w = doc.data()||{};
      if((w.attendance||'').trim()) rsvpN++;
      if(((w.wish||w.message||'').trim())) wishN++;
    });
    var el = document.getElementById('kt2WishCount'); if(el) el.textContent = wishN;
    var el2 = document.getElementById('kt2RsvpCount'); if(el2) el2.textContent = rsvpN;
  }).catch(function(){});
  ref.collection('checkins').get().then(function(s){
    var el = document.getElementById('kt2CheckinCount'); if(el) el.textContent = s.size;
  }).catch(function(){});
}
function kt2Tamu(main){
  var guests = (KT2.data||{}).guests || [];
  var sent = (KT2.data||{}).sentGuests || {};
  var rows = guests.map(function(g, i){
    var s = sent[g] ? '<span class="pill green">Terkirim</span>' : '<span class="pill gray">Belum</span>';
    return '<tr><td><b>'+kt2Esc(g)+'</b></td><td>'+s+'</td>' +
      '<td style="text-align:right;white-space:nowrap">' +
      '<button class="kt2-btn line small" onclick="kt2CopyGuest('+i+')">Salin Link</button> ' +
      '<button class="kt2-btn dark small" onclick="kt2WaGuest('+i+')">WA</button> ' +
      '<button class="kt2-btn line small" onclick="kt2DelGuest('+i+')" style="color:#c00">Hapus</button>' +
      '</td></tr>';
  }).join('');
  main.innerHTML =
    '<div class="kt2-head"><div><h1>Daftar Tamu</h1><p>'+guests.length+' tamu terdaftar</p></div></div>' +
    '<div class="kt2-section"><h3>➕ Tambah Tamu Manual</h3>' +
    '<div style="display:flex;gap:10px"><input id="kt2NewGuest" placeholder="Nama tamu..." style="flex:1;padding:12px;border:1px solid #ddd;border-radius:10px;font-size:14px" onkeydown="if(event.keyCode==13)kt2AddGuest()">' +
    '<button class="kt2-btn dark" onclick="kt2AddGuest()">Tambah</button></div></div>' +
    '<input class="kt2-search" id="kt2Search" placeholder="🔍 Cari nama tamu..." oninput="kt2FilterTamu(this.value)">' +
    '<div class="kt2-section" style="padding:0;overflow-x:auto;-webkit-overflow-scrolling:touch"><table class="kt2-table" style="min-width:620px">' +
    '<thead><tr><th>Nama</th><th>Status</th><th style="text-align:right">Aksi</th></tr></thead>' +
    '<tbody id="kt2TamuBody">'+rows+'</tbody></table>' +
    (guests.length ? '' : '<div class="kt2-empty"><div class="big">👥</div><p>Belum ada tamu.<br>Tambahkan manual di atas.</p></div>') +
    '</div>';
}
function kt2FilterTamu(q){
  q = q.toLowerCase();
  document.querySelectorAll('#kt2TamuBody tr').forEach(function(tr){
    tr.style.display = tr.textContent.toLowerCase().indexOf(q) > -1 ? '' : 'none';
  });
}
function kt2Rsvp(main){
  main.innerHTML = '<div class="kt2-head"><div><h1>Konfirmasi Kehadiran</h1><p>RSVP dari tamu via undangan</p></div></div>' +
    '<div class="kt2-section" id="kt2RsvpList"><div class="kt2-empty"><div class="big">⏳</div><p>Memuat...</p></div></div>';
  if(!window.db) return;
  db.collection('tokens').doc(KT2.code).collection('wishes').orderBy('createdAt','desc').get().then(function(snap){
    var el = document.getElementById('kt2RsvpList');
    if(snap.empty){ el.innerHTML = '<div class="kt2-empty"><div class="big">📭</div><p>Belum ada RSVP masuk.</p></div>'; return; }
    var html = '<table class="kt2-table"><thead><tr><th>Nama</th><th>Status</th><th>Waktu</th></tr></thead><tbody>';
    var seenNames = {};
    snap.forEach(function(doc){
      var w = doc.data();
      var nameKey = ((w.name||w.from||'?').trim()).toLowerCase();
      if(seenNames[nameKey]) return; // dedupe: keep latest (ordered desc)
      seenNames[nameKey] = true;
      var att = (w.attendance||'').toLowerCase();
      var pill = att.indexOf('hadir') > -1 && att.indexOf('berhalangan') === -1 ? '<span class="pill green">Hadir</span>'
        : att.indexOf('ragu') > -1 || att.indexOf('mungkin') > -1 ? '<span class="pill gold">Ragu</span>'
        : '<span class="pill gray">Berhalangan</span>';
      html += '<tr><td><b>'+kt2Esc(w.name||w.from||'?')+'</b></td><td>'+pill+'</td><td style="color:#888;font-size:13px">'+kt2Time(w.createdAt)+'</td></tr>';
    });
    el.innerHTML = html + '</tbody></table>';
  });
}
function kt2Checkin(main){
  main.innerHTML = '<div class="kt2-head"><div><h1>Check-in Hari-H</h1><p>Scan QR tamu saat acara</p></div>' +
    '<a class="kt2-btn dark" href="checkin.html?t='+KT2.code+'" target="_blank">📷 Buka Scanner</a></div>' +
    '<div class="kt2-cards">' +
    '<div class="kt2-card gold"><div class="lbl">Sudah Check-in</div><div class="val" id="kt2CiCount">-</div></div>' +
    '<div class="kt2-card"><div class="lbl">Belum Hadir</div><div class="val" id="kt2CiPending">-</div></div>' +
    '</div>' +
    '<div class="kt2-section" id="kt2CiList"><div class="kt2-empty"><div class="big">⏳</div><p>Memuat...</p></div></div>';
  if(!window.db) return;
  var guests = (KT2.data||{}).guests || [];
  db.collection('tokens').doc(KT2.code).collection('checkins').orderBy('at','desc').get().then(function(snap){
    document.getElementById('kt2CiCount').textContent = snap.size;
    var checkedNames = {};
    snap.forEach(function(doc){ var g = ((doc.data()||{}).guest||'').trim().toLowerCase(); if(g) checkedNames[g] = true; });
    var matched = guests.filter(function(g){ return checkedNames[(g||'').trim().toLowerCase()]; }).length;
    document.getElementById('kt2CiPending').textContent = Math.max(0, guests.length - matched);
    var el = document.getElementById('kt2CiList');
    if(snap.empty){ el.innerHTML = '<div class="kt2-empty"><div class="big">📷</div><p>Belum ada yang check-in.<br>Buka scanner untuk mulai.</p></div>'; return; }
    var html = '<h3>Daftar Check-in</h3><table class="kt2-table"><thead><tr><th>Nama</th><th>Waktu</th></tr></thead><tbody>';
    var checkedNames = {};
    snap.forEach(function(doc){
      var c = doc.data();
      checkedNames[((c.guest||'').trim()).toLowerCase()] = true;
      html += '<tr><td><b>'+kt2Esc(c.guest||'?')+'</b> <span class="pill green">Hadir</span></td><td style="color:#888;font-size:13px">'+kt2Time(c.at)+'</td></tr>';
    });
    el.innerHTML = html + '</tbody></table>';
    // Daftar tamu yang BELUM hadir (by nama)
    var pending = guests.filter(function(g){ return !checkedNames[(g||'').trim().toLowerCase()]; });
    var ph = '<div class="kt2-section"><h3>⏳ Belum Hadir (' + pending.length + ')</h3>';
    if(!pending.length){ ph += '<div class="kt2-empty"><div class="big">🎉</div><p>Semua tamu sudah check-in!</p></div>'; }
    else {
      ph += '<table class="kt2-table"><thead><tr><th>Nama</th><th style="text-align:right">Aksi</th></tr></thead><tbody>';
      pending.forEach(function(g){
        ph += '<tr><td><b>' + kt2Esc(g) + '</b> <span class="pill gold">Belum</span></td>' +
          '<td style="text-align:right;white-space:nowrap">' +
          '<button class="kt2-btn line small" onclick="kt2CopyGuestByName(\'' + g.replace(/'/g, "\\'") + '\')">Salin Link</button> ' +
          '<button class="kt2-btn dark small" onclick="kt2WaGuestByName(\'' + g.replace(/'/g, "\\'") + '\')">WA</button>' +
          '</td></tr>';
      });
      ph += '</tbody></table>';
    }
    ph += '</div>';
    el.innerHTML += ph;
  });
}
function kt2Ucapan(main){
  main.innerHTML = '<div class="kt2-head"><div><h1>Ucapan Tamu</h1><p>Pesan dan doa dari undangan</p></div></div>' +
    '<div class="kt2-section" id="kt2WishList"><div class="kt2-empty"><div class="big">⏳</div><p>Memuat...</p></div></div>';
  if(!window.db) return;
  db.collection('tokens').doc(KT2.code).collection('wishes').orderBy('createdAt','desc').get().then(function(snap){
    var el = document.getElementById('kt2WishList');
    if(snap.empty){ el.innerHTML = '<div class="kt2-empty"><div class="big">💬</div><p>Belum ada ucapan.</p></div>'; return; }
    var html = '';
    snap.forEach(function(doc){
      var w = doc.data();
      var wishTxt = (w.wish||w.message||'').trim();
      if(!wishTxt) return; // Skip RSVP-only entries (no wish text)
      html += '<div style="padding:16px 0;border-bottom:1px solid #f0f0f0"><b>'+kt2Esc(w.name||w.from||'?')+'</b> ' +
        '<span style="font-size:12px;color:#888">'+kt2Time(w.createdAt)+'</span>' +
        '<p style="margin:8px 0 0;color:#333;font-style:italic">“'+kt2Esc(wishTxt)+'”</p></div>';
    });
    if(!html){ el.innerHTML = '<div class="kt2-empty"><div class="big">💬</div><p>Belum ada ucapan.</p></div>'; return; }
    el.innerHTML = html;
  });
}
function kt2Bagikan(main){
  var base = location.origin + location.pathname.replace(/[^\/]*\.html?$/,'');
  var customUrl = (KT2.data||{}).customUrl || '';
  var url = customUrl ? ((customUrl.indexOf('http') === 0 ? customUrl : base + customUrl) + '?t=' + KT2.code) : base + 'undangan-' + (KT2.data.template||'') + '.html?t=' + KT2.code;
  main.innerHTML = '<div class="kt2-head"><div><h1>Bagikan Undangan</h1><p>Kirim link ke tamu via WhatsApp</p></div></div>' +
    '<div class="kt2-section"><h3>🔗 Link Umum</h3>' +
    '<div style="display:flex;gap:10px"><input id="kt2BaseUrl" readonly value="'+kt2Esc(url)+'" style="flex:1;padding:12px;border:1px solid #ddd;border-radius:10px;font-size:13px">' +
    '<button class="kt2-btn dark" onclick="kt2CopyBase()">Salin</button></div>' +
    '<p style="font-size:13px;color:#666;margin:12px 0 0">Link personal per tamu tersedia di tab <b>Daftar Tamu</b>.</p></div>' +
    '<div class="kt2-section"><h3>📷 Scanner Check-in</h3>' +
    '<p style="font-size:14px;color:#666">Bagikan link ini ke panitia hari-H:</p>' +
    '<div style="display:flex;gap:10px;margin-top:10px"><input readonly value="'+location.origin+location.pathname.replace(/[^\/]*\.html?$/,'')+'checkin.html?t='+KT2.code+'" style="flex:1;padding:12px;border:1px solid #ddd;border-radius:10px;font-size:13px">' +
    '<button class="kt2-btn dark" onclick="navigator.clipboard.writeText(this.previousElementSibling.value);this.textContent=\'Disalin!\'">Salin</button></div></div>';
}
function kt2CopyBase(){
  var i = document.getElementById('kt2BaseUrl'); i.select();
  document.execCommand('copy'); alert('Link disalin!');
}
function kt2CopyGuest(i){
  var g = (KT2.data.guests||[])[i]; if(!g) return;
  var base = location.origin + location.pathname.replace(/[^\/]*\.html?$/,'');
  var customUrl = (KT2.data||{}).customUrl || '';
  var baseUrl = customUrl ? ((customUrl.indexOf('http') === 0 ? customUrl : base + customUrl) + '?t=' + KT2.code) : base + 'undangan-' + (KT2.data.template||'') + '.html?t=' + KT2.code;
  var url = baseUrl + '&to=' + encodeURIComponent(g);
  navigator.clipboard.writeText(url).then(function(){ kt2MarkSent(g); alert('Link '+g+' disalin!'); });
}
function kt2WaGuest(i){
  var g = (KT2.data.guests||[])[i]; if(!g) return;
  var base = location.origin + location.pathname.replace(/[^\/]*\.html?$/,'');
  var customUrl = (KT2.data||{}).customUrl || '';
  var baseUrl = customUrl ? ((customUrl.indexOf('http') === 0 ? customUrl : base + customUrl) + '?t=' + KT2.code) : base + 'undangan-' + (KT2.data.template||'') + '.html?t=' + KT2.code;
  var url = baseUrl + '&to=' + encodeURIComponent(g);
  var msg = 'Halo '+g+'! Kamu diundang ke pernikahan kami. Buka undangannya di sini ya: '+url;
  kt2MarkSent(g);
  window.open('https://wa.me/?text='+encodeURIComponent(msg), '_blank');
}
function kt2CopyGuestByName(name){
  var guests = (KT2.data||{}).guests || [];
  var i = guests.indexOf(name);
  if(i > -1) kt2CopyGuest(i);
}
function kt2WaGuestByName(name){
  var guests = (KT2.data||{}).guests || [];
  var i = guests.indexOf(name);
  if(i > -1) kt2WaGuest(i);
}
function kt2MarkSent(g){
  if(!window.db || !KT2.code || !g) return;
  // Update local immediately for responsive UI
  KT2.data.sentGuests = KT2.data.sentGuests || {};
  KT2.data.sentGuests[g] = true;
  kt2Show(KT2.tab);
  // Save to Firestore with fetch-then-save pattern
  var sent = KT2.data.sentGuests;
  db.collection('tokens').doc(KT2.code).get().then(function(snap){
    var doc = snap.data() || {};
    var curRev = doc.revisionsUsed || 0;
    // Merge with existing sentGuests from server to avoid overwriting
    var serverSent = (doc.data||{}).sentGuests || {};
    for(var k in sent) serverSent[k] = sent[k];
    return db.collection('tokens').doc(KT2.code).set({
      data: { sentGuests: serverSent },
      revisionsUsed: curRev + 1,
      updatedAt: firebase.firestore.FieldValue.serverTimestamp()
    }, { merge: true }).then(function(){
      KT2.revisionsUsed = curRev + 1;
      KT2.data.sentGuests = serverSent;
    });
  }).catch(function(e){
    console.log('kt2MarkSent failed:', e.message);
  });
}

function kt2AddGuest(){
  var input = document.getElementById('kt2NewGuest');
  var name = (input.value||'').trim();
  if(!name){ alert('Masukkan nama tamu'); return; }
  if(!window.db || !KT2.code){ alert('Koneksi bermasalah'); return; }
  var guests = (KT2.data||{}).guests || [];
  if(guests.indexOf(name) > -1){ alert('Nama sudah ada'); return; }
  var btn = input.nextElementSibling;
  if(btn){ btn.disabled = true; btn.textContent = 'Menyimpan...'; }
  guests.push(name);
  var curRev = KT2.revisionsUsed || 0;
  // Also need top-level revisionsUsed for the rule check
  db.collection('tokens').doc(KT2.code).set({
    data: { guests: guests },
    revisionsUsed: curRev + 1,
    updatedAt: firebase.firestore.FieldValue.serverTimestamp()
  }, { merge: true }).then(function(){
    KT2.data.guests = guests;
    KT2.revisionsUsed = curRev + 1;
    kt2Show('tamu');
  }).catch(function(e){ if(btn){ btn.disabled = false; btn.textContent = 'Tambah'; } alert('Gagal: ' + e.message); });
}
function kt2DelGuest(i){
  if(!confirm('Hapus tamu ini?')) return;
  var guests = (KT2.data||{}).guests || [];
  var removed = guests.splice(i, 1);
  // also remove from sentGuests
  var sent = (KT2.data||{}).sentGuests || {};
  delete sent[removed[0]];
  var curRev2 = KT2.revisionsUsed || 0;
  db.collection('tokens').doc(KT2.code).set({
    data: { guests: guests, sentGuests: sent },
    revisionsUsed: curRev2 + 1,
    updatedAt: firebase.firestore.FieldValue.serverTimestamp()
  }, { merge: true }).then(function(){
    KT2.data.guests = guests; KT2.data.sentGuests = sent;
    kt2Show('tamu');
  }).catch(function(e){ alert('Gagal: ' + e.message); });
}

function kt2Esc(s){ return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function kt2Time(ts){
  if(!ts) return '-';
  try { var d = ts.toDate ? ts.toDate() : new Date(ts); return d.toLocaleString('id-ID',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'}); }
  catch(e){ return '-'; }
}

    <script>
    /* ===== TOKEN FORM + AUTO-START (halaman standalone) ===== */
    (function(){
      function normalizeCode(v){ return (v || "").trim().toUpperCase().replace(/[^A-Z0-9]/g, ""); }
      var input = document.getElementById('ktTokenInput');
      var btn = document.getElementById('ktTokenBtn');
      var errEl = document.getElementById('ktTokenError');
      var wrap = document.getElementById('ktTokenWrap');
      function showErr(m){ errEl.textContent = m; errEl.classList.add('show'); }
      function hideErr(){ errEl.textContent = ''; errEl.classList.remove('show'); }
      function openToken(code){
        hideErr();
        if(!code || code.length < 4){ showErr('Masukkan kode token dulu ya.'); return; }
        if(typeof db === 'undefined' || !db){ showErr('Koneksi database belum siap. Coba lagi.'); return; }
        btn.disabled = true; btn.textContent = 'Memeriksa\u2026';
        db.collection('tokens').doc(code).get().then(function(snap){
          btn.disabled = false; btn.textContent = 'Buka Dashboard';
          if(!snap.exists){ showErr('Token tidak ditemukan.'); return; }
          var doc = snap.data() || {};
          if(doc.status === 'revoked'){ showErr('Token ini sudah dicabut.'); return; }
          var d = doc.data || {};
          wrap.style.display = 'none';
          kt2Open(code, {
            guests: d.guests || [],
            sentGuests: d.sentGuests || {},
            template: doc.template || '',
            groomName: d.groomName || '',
            brideName: d.brideName || '',
            customUrl: d.customUrl || ''
          }, doc.revisionsUsed || 0);
        }).catch(function(){
          btn.disabled = false; btn.textContent = 'Buka Dashboard';
          showErr('Gagal memeriksa token. Coba lagi.');
        });
      }
      btn.addEventListener('click', function(){ openToken(normalizeCode(input.value)); });
      input.addEventListener('keydown', function(e){ if(e.key === 'Enter'){ e.preventDefault(); btn.click(); } });
      // "Tutup" di dashboard kembali ke form token (bukan ke katalog).
      var _kt2CloseOrig = typeof kt2Close === 'function' ? kt2Close : null;
      window.kt2Close = function(){
        if(_kt2CloseOrig) _kt2CloseOrig();
        wrap.style.display = '';
        document.body.style.overflow = '';
      };
      // Auto-start: ?t=KODE
      var params = new URLSearchParams(location.search);
      var t = normalizeCode(params.get('t') || '');
      if(t){ input.value = t; openToken(t); }
    })();
    </script>
