<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>App Check Probe (sementara)</title>
<style>body{font-family:monospace;padding:24px;background:#111;color:#0f0}h1{font-size:28px}pre{font-size:20px;white-space:pre-wrap}</style>
<script defer src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script defer src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<script defer src="https://www.gstatic.com/firebasejs/10.12.0/firebase-appcheck-compat.js"></script>
</head><body>
<h1>APP CHECK PROBE</h1>
<pre id="out">MENUNGGU...</pre>
<script>
window.addEventListener('load', async () => {
  const out = document.getElementById('out');
  const log = (s) => { out.textContent += '\n' + s; };
  try {
    if (typeof firebase === 'undefined') { out.textContent = 'FIREBASE_UNDEFINED'; return; }
    firebase.initializeApp({
                  apiKey: "AIzaSyBt8I9QJS3-TYQsp-mccVulMvvx95-mamw",
                  authDomain: "undangan-digital-f4310.firebaseapp.com",
                  projectId: "undangan-digital-f4310"
                });
    try { firebase.appCheck().activate('6LflJxMuAAAAAGRmOz5QTdfUx5K__zqzAnC3BNQG', true); log('ACTIVATE_OK'); }
    catch (e) { log('ACTIVATE_FAIL ' + (e.code || e.message)); }
    try {
      const t = await firebase.appCheck().getToken();
      log('APPCHECK_TOKEN_OK token=' + !!t.token + ' len=' + (t.token ? t.token.length : 0));
    } catch (e) { log('APPCHECK_TOKEN_FAIL ' + (e.code || e.message)); }
    try {
      const t2 = await firebase.appCheck().getToken(true);
      log('FORCE_OK token=' + !!t2.token);
    } catch (e) { log('FORCE_FAIL ' + (e.code || e.message)); }
    try {
      const d = await firebase.firestore().collection('tokens').doc('AZ5QCPZJFJ').get();
      log('FIRESTORE_READ_OK exists=' + d.exists + ' customer=' + (d.exists ? d.data().customer : '-'));
    } catch (e) { log('FIRESTORE_READ_FAIL ' + (e.code || e.message)); }
  } catch (e) {
    out.textContent = 'PROBE_ERROR ' + (e.code || e.message);
  }
});
</script>
</body></html>
